<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>解压</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      --bar-bg: #e4e7ec;
      --bar-fill: #0f766e;
      --bar-success: #15803d;
      --bar-error: #b42318;
      --detail: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bar-bg: #374151;
        --bar-fill: #2dd4bf;
        --bar-success: #4ade80;
        --bar-error: #f87171;
        --detail: #9ca3af;
      }
    }
    body {
      margin: 0;
      padding: 20px 22px 16px;
      background: #f6f7f9;
      color: #1f2933;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1f24;
        color: #f3f4f6;
      }
      .message { color: #d1d5db; }
      button.secondary {
        background: #2a3038;
        color: #f3f4f6;
        border-color: #3d4450;
      }
    }
    h1 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 650;
    }
    .file {
      margin: 0 0 12px;
      font-size: 13px;
      word-break: break-all;
    }
    .progress-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .message {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: #4b5563;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .percent {
      flex: none;
      min-width: 42px;
      text-align: right;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--bar-fill);
    }
    .bar {
      position: relative;
      height: 8px;
      margin-bottom: 8px;
      border-radius: 999px;
      background: var(--bar-bg);
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--bar-fill);
      transition: width 0.18s ease;
    }
    .bar.indeterminate .fill {
      width: 40%;
      animation: slide 1.1s ease-in-out infinite;
    }
    .bar.success .fill { background: var(--bar-success); }
    .bar.error .fill { background: var(--bar-error); }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(280%); }
    }
    .detail {
      margin: 0 0 10px;
      min-height: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--detail);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .password {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-all;
      user-select: text;
    }
    .error-log {
      margin: 0 0 12px;
      max-height: 160px;
      overflow: auto;
      padding: 8px 10px;
      border-radius: 6px;
      background: #fff5f5;
      color: #7f1d1d;
      font: 12px/1.5 Consolas, "Microsoft YaHei", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }
    @media (prefers-color-scheme: dark) {
      .error-log {
        background: #3f1d1d;
        color: #fecaca;
      }
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: #0f766e;
      color: white;
    }
    button.secondary {
      background: white;
      color: #1f2933;
      border: 1px solid #d0d5dd;
    }
    button[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .bar.indeterminate .fill { animation: none; width: 100%; opacity: 0.55; }
    }
  </style>
</head>
<body>
  <h1 id="title">正在解压</h1>
  <p class="file" id="file"></p>
  <div class="progress-line">
    <p class="message" id="message">准备解压</p>
    <span class="percent" id="percent"></span>
  </div>
  <div class="bar indeterminate" id="bar"><div class="fill" id="fill"></div></div>
  <p class="detail" id="detail"></p>
  <p class="password" id="password" hidden></p>
  <pre class="error-log" id="errorLog" hidden></pre>
  <div class="actions">
    <button class="secondary" id="copy" type="button" hidden>复制错误</button>
    <button class="secondary" id="main" type="button">打开主界面</button>
    <button class="primary" id="folder" type="button" hidden>打开文件夹</button>
    <button class="secondary" id="close" type="button">关闭</button>
  </div>
  <script>
    const title = document.getElementById('title')
    const file = document.getElementById('file')
    const message = document.getElementById('message')
    const percentLabel = document.getElementById('percent')
    const bar = document.getElementById('bar')
    const fill = document.getElementById('fill')
    const detail = document.getElementById('detail')
    const passwordLine = document.getElementById('password')
    const errorLog = document.getElementById('errorLog')
    const copyButton = document.getElementById('copy')
    const folderButton = document.getElementById('folder')
    let outputDir = ''
    let errorText = ''

    window.shellExtract.onUpdate((state) => {
      file.textContent = state.fileName || ''
      message.textContent = state.message || ''
      detail.textContent = state.detail || ''
      outputDir = state.outputDir || ''
      errorText = state.errorLog || ''

      if (state.password) {
        passwordLine.hidden = false
        passwordLine.textContent = `使用的密码：${state.password}`
      } else {
        passwordLine.hidden = true
        passwordLine.textContent = ''
      }

      const failed = state.status === 'error' && errorText
      errorLog.hidden = !failed
      errorLog.textContent = failed ? errorText : ''
      copyButton.hidden = !failed
      if (failed) copyButton.textContent = '复制错误'

      const running = state.status !== 'success' && state.status !== 'error'
      const indeterminate = running && state.indeterminate === true
      const percent = Number.isFinite(state.percent)
        ? Math.min(100, Math.max(0, state.percent))
        : 0

      bar.classList.toggle('indeterminate', indeterminate)
      bar.classList.toggle('success', state.status === 'success')
      bar.classList.toggle('error', state.status === 'error')
      if (indeterminate) {
        fill.style.width = ''
      } else {
        fill.style.width = `${percent}%`
      }

      if (state.status === 'success') {
        title.textContent = '解压完成'
        percentLabel.textContent = '100%'
      } else if (state.status === 'error') {
        title.textContent = '解压没有完成'
        percentLabel.textContent = ''
      } else {
        title.textContent = '正在解压'
        percentLabel.textContent = indeterminate ? '' : `${percent}%`
      }

      folderButton.hidden = state.status !== 'success' || !outputDir
    })

    folderButton.addEventListener('click', () => {
      if (outputDir) window.shellExtract.openFolder(outputDir)
    })
    copyButton.addEventListener('click', async () => {
      if (!errorText) return
      await window.shellExtract.copyText(errorText)
      copyButton.textContent = '已复制'
    })
    document.getElementById('close').addEventListener('click', () => {
      window.shellExtract.close()
    })
    document.getElementById('main').addEventListener('click', () => {
      window.shellExtract.showMain()
    })
  </script>
</body>
</html>
