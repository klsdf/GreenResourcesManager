name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'green-resources-manager/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'green-resources-manager/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: green-resources-manager

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: green-resources-manager/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm run test:run
