name: Build & Release

# 推送 v* 标签时自动构建并发布；也可在 Actions 页面手动指定已存在的标签重新发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新构建并发布的标签，例如 v0.7.7（必须已推送到仓库）'
        required: true

permissions:
  contents: write

jobs:
  release:
    # 固定在 windows-2022：上面还有 Visual Studio 2022，node-gyp 10 能找到编译器。
    # windows-latest 已经换成 Visual Studio 2026，当前这套打包工具认不出来。
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: green-resources-manager

    steps:
      - name: 解析发布标签
        id: release
        shell: bash
        working-directory: .
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布标签: $tag"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: green-resources-manager/package-lock.json

      - name: 校验标签与 package.json 版本一致
        shell: bash
        working-directory: .
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          pkg=$(node -p "require('./green-resources-manager/package.json').version")
          tag="${TAG#v}"
          echo "package.json=$pkg tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::标签 $TAG 与 package.json 版本 $pkg 不一致"
            exit 1
          fi

      - name: 读取发布文案
        id: notes
        shell: bash
        working-directory: .
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          file="release-notes/${TAG}.md"
          if [ ! -f "$file" ]; then
            echo "标签中没有 $file，尝试从 main 获取"
            git fetch --depth=1 origin main
            mkdir -p release-notes
            git show "FETCH_HEAD:$file" > "$file" || {
              echo "::error::缺少发布文案 $file"
              exit 1
            }
          fi
          title=$(head -n 1 "$file" | sed 's/^# *//' | tr -d '\r')
          tail -n +2 "$file" > release-body.md
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: npm ci

      # electron-builder 会调用 node_modules/.bin/node-gyp 重编 better-sqlite3。
      # 现在这个命令来自已弃用的 electron-rebuild，版本停在 9.4.1。
      # 它的 gyp 脚本会 import distutils，而 runner 上的 Python 3.12 已经删除该模块，打包会立刻失败。
      # node-gyp 10 去掉了这个依赖。只装在打包机上，不改 package.json 和 lock。
      - name: 升级 node-gyp 以兼容 Python 3.12
        run: npm install --no-save --no-package-lock node-gyp@10.2.0

      - name: 构建前端
        run: npm run build

      - name: 打包 Windows 安装包（不上传）
        shell: bash
        run: |
          set +e
          npx electron-builder --win --publish never > electron-builder.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "----- electron-builder 输出（末尾） -----"
            tail -n 120 electron-builder.log
            # 日志页需要登录才能看。把失败摘要写进注解，公开接口也能读到原因。
            msg=$(tail -n 25 electron-builder.log | tr '\r' ' ' | tr '\n' ' ' | cut -c1-700)
            echo "::error::$msg"
            exit "$code"
          fi

      - name: 汇总发布附件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./package.json').version"
          $out = "dist-electron/v$ver"
          $assets = "release-assets"
          New-Item -ItemType Directory -Force $assets | Out-Null

          # Publish only latest.yml and the portable zip.
          Copy-Item "$out/latest.yml" $assets

          # portable zip keeps a top-level GreenResourcesManager_<version> folder
          $green = Join-Path $assets "GreenResourcesManager_$ver"
          New-Item -ItemType Directory -Force $green | Out-Null
          Copy-Item "$out/win-unpacked/*" $green -Recurse -Force
          Compress-Archive -Path $green -DestinationPath "$assets/GRM_$ver.zip" -Force
          Remove-Item $green -Recurse -Force

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: green-resources-manager/release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
