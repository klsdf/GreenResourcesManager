name: Build & Release

# 推送 v* 标签时自动构建并发布；也可在 Actions 页面手动指定已存在的标签重新发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新构建并发布的标签，例如 v0.7.7（必须已推送到仓库）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: green-resources-manager

    steps:
      - name: 解析发布标签
        id: release
        shell: bash
        working-directory: .
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布标签: $tag"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: green-resources-manager/package-lock.json

      - name: 校验标签与 package.json 版本一致
        shell: bash
        working-directory: .
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          pkg=$(node -p "require('./green-resources-manager/package.json').version")
          tag="${TAG#v}"
          echo "package.json=$pkg tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::标签 $TAG 与 package.json 版本 $pkg 不一致"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 为 Electron 重编译 better-sqlite3 原生模块
        run: npx electron-rebuild -f -w better-sqlite3

      - name: 构建前端
        run: npm run build

      - name: 打包 Windows 安装包（不上传）
        run: npx electron-builder --win --publish never

      - name: 汇总发布附件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./package.json').version"
          $out = "dist-electron/v$ver"
          $assets = "release-assets"
          New-Item -ItemType Directory -Force $assets | Out-Null

          Copy-Item "$out/GreenResourcesManager_Setup_$ver.exe" $assets
          Copy-Item "$out/GreenResourcesManager_Portable_$ver.exe" $assets
          Copy-Item "$out/latest.yml" $assets
          Get-ChildItem "$out/*.blockmap" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $assets

          # portable zip keeps a top-level GreenResourcesManager_<version> folder
          $green = Join-Path $assets "GreenResourcesManager_$ver"
          New-Item -ItemType Directory -Force $green | Out-Null
          Copy-Item "$out/win-unpacked/*" $green -Recurse -Force
          Compress-Archive -Path $green -DestinationPath "$assets/GRM_$ver.zip" -Force
          Remove-Item $green -Recurse -Force

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: green-resources-manager/release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
