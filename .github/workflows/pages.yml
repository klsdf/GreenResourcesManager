name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'green-resources-manager/src/components/help/**'
      - 'green-resources-manager/src/components/DetailCard.vue'
      - 'green-resources-manager/src/components/CodeBlock.vue'
      - 'green-resources-manager/src/composables/useHelpUtils.ts'
      - 'green-resources-manager/src/utils/constants.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建官网
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
